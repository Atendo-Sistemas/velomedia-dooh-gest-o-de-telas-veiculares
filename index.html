<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>VeloMedia DOOH - Gestão de Telas Veiculares</title>
    <meta name="description" content="Plataforma SaaS multi-tenant de gestão de telas interativas em táxis e carros de aplicativo (DOOH) com cadastro de motoristas, TVs, anunciantes e usuários." />
    <!-- PWA Manifest & App Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    
    <!-- Mobile Web App / Kiosk Fullscreen Capabilities -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VeloPlayer TV" />
    <meta name="theme-color" content="#020617" />
    <meta property="og:title" content="VeloMedia DOOH - Gestão de Telas Veiculares" />
    <meta property="og:description" content="Plataforma SaaS multi-tenant de gestão de telas interativas em táxis e carros de aplicativo (DOOH) com cadastro de motoristas, TVs, anunciantes e usuários." />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Register Service Worker for PWA Offline Kiosk Caching
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('VeloMedia Kiosk PWA Service Worker ativo:', reg.scope))
            .catch((err) => console.log('SW registration note:', err));
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
