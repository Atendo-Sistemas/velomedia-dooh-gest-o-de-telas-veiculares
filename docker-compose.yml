services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DOCKERIZED: "true"
      DATA_FILE_PATH: /var/lib/velomedia/velomedia_store.json
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-3300}:3000"
    volumes:
      - velomedia_data:/var/lib/velomedia
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  velomedia_data:
