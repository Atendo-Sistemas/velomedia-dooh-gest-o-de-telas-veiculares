<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#22d3ee" stroke-opacity="0.3" stroke-width="6"/>

  <!-- Glowing Aura -->
  <circle cx="256" cy="256" r="140" fill="#22d3ee" fill-opacity="0.12" filter="url(#glow)"/>

  <!-- TV / Tablet Screen Bezel -->
  <rect x="80" y="110" width="352" height="236" rx="24" fill="#090d16" stroke="url(#cyanGrad)" stroke-width="8"/>
  
  <!-- Screen Glass Area -->
  <rect x="96" y="126" width="320" height="204" rx="14" fill="#030712"/>

  <!-- Display Play Badge & Sound Waves -->
  <polygon points="230,185 305,228 230,271" fill="url(#cyanGrad)"/>
  
  <!-- Modern Speed Lines / Broadcast Waves -->
  <path d="M 335 190 A 50 50 0 0 1 335 266" fill="none" stroke="#818cf8" stroke-width="8" stroke-linecap="round"/>
  <path d="M 360 170 A 80 80 0 0 1 360 286" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-opacity="0.7"/>

  <!-- Car / Mobility Foundation Icon at Bottom -->
  <rect x="196" y="370" width="120" height="14" rx="7" fill="#334155"/>
  <path d="M 160 410 L 352 410 L 332 440 L 180 440 Z" fill="url(#purpleGrad)" rx="8"/>
  <circle cx="205" cy="442" r="14" fill="#020617" stroke="#22d3ee" stroke-width="5"/>
  <circle cx="307" cy="442" r="14" fill="#020617" stroke="#22d3ee" stroke-width="5"/>

  <!-- Kiosk Lock Badge on Top Right -->
  <circle cx="410" cy="110" r="28" fill="#020617" stroke="#38bdf8" stroke-width="4"/>
  <path d="M 403 108 L 403 103 A 7 7 0 0 1 417 103 L 417 108 M 400 108 L 420 108 A 2 2 0 0 1 422 110 L 422 120 A 2 2 0 0 1 420 122 L 400 122 A 2 2 0 0 1 398 120 L 398 110 A 2 2 0 0 1 400 108 Z" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Brand Typography -->
  <text x="256" y="482" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="4">VELO PLAYER</text>
</svg>
